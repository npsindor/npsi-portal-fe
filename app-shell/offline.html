<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NPS Indore</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #102A43; color: #F5EFE0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; }
      .mark { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; border: 2px solid #C9A646; display: flex; align-items: center; justify-content: center; font-size: 30px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #E9D9A6; }
      p { margin: 0 0 6px; color: #D6CCB4; font-size: 15px; }
      button { margin-top: 20px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #C9A646; color: #102A43; font: 700 16px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Shown by the app when npsindore.org can't be reached (no internet). -->
    <main>
      <div class="mark" aria-hidden="true">📶</div>
      <h1>इंटरनेट से कनेक्ट नहीं हो सका</h1>
      <p>कृपया इंटरनेट कनेक्शन जाँचें और फिर कोशिश करें।</p>
      <p>No internet connection. Please check it and try again.</p>
      <button type="button" onclick="location.href='https://npsindore.org/'">फिर कोशिश करें / Try again</button>
    </main>
  </body>
</html>
